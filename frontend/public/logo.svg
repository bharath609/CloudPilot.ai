<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CloudPilot AI">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101B31"/>
      <stop offset="1" stop-color="#16233F"/>
    </linearGradient>
    <linearGradient id="track" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="vector" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="60" fill="url(#tile)"/>
  <rect x="5" y="5" width="246" height="246" rx="59" fill="none" stroke="#22304E" stroke-width="2"/>
  <rect x="17" y="17" width="222" height="222" rx="47" fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="2"/>

  <!-- soft halo, kept separate so the mark itself stays crisp -->
  <g filter="url(#glow)" opacity="0.45">
    <path d="M176 92 A62 62 0 1 0 176 168" fill="none" stroke="#38BDF8" stroke-width="24" stroke-linecap="round"/>
    <path d="M128 92 L152 122 H138 V158 H118 V122 H104 Z" fill="#818CF8"/>
  </g>

  <!-- heading ring: an open "C" with the course gap on the right -->
  <path d="M176 92 A62 62 0 1 0 176 168"
        fill="none" stroke="url(#track)" stroke-width="24" stroke-linecap="round"/>
  <!-- ascent vector -->
  <path d="M128 88 L154 120 H139 V158 H117 V120 H102 Z" fill="url(#vector)"/>

  <!-- departure points -->
  <circle cx="194" cy="105" r="4.5" fill="#38BDF8" fill-opacity="0.9"/>
  <circle cx="204" cy="130" r="3" fill="#818CF8" fill-opacity="0.75"/>
</svg>
