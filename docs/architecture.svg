<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CloudPilot AI architecture</title>
  <desc id="desc">A local browser talks to a FastAPI application that stores data in SQLite or PostgreSQL. CSV files are imported, deterministic services calculate costs, findings and forecasts, and an optional OpenAI-compatible provider only explains already computed evidence. No cloud account is read or written.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4a63"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f7f9fc"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#122033">CloudPilot AI architecture</text>
  <text x="40" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5b73">Local-first, deterministic calculations, optional explanation-only AI, no cloud write path.</text>

  <!-- Compose boundary -->
  <rect x="32" y="104" width="856" height="560" rx="16" fill="#ffffff" stroke="#b8c4d6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="52" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6b83" letter-spacing="1">DOCKER COMPOSE · LOCAL MACHINE</text>

  <!-- Browser -->
  <rect x="60" y="168" width="210" height="150" rx="12" fill="#eef4ff" stroke="#6f8fc4" stroke-width="2"/>
  <text x="82" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#17325c">Browser</text>
  <text x="82" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334a6b">React 19 + TypeScript SPA</text>
  <text x="82" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334a6b">HashRouter, exact decimal money</text>
  <text x="82" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334a6b">Charts, review and audit pages</text>
  <text x="82" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b83">No credentials stored in the UI</text>

  <!-- CSV input -->
  <rect x="60" y="350" width="210" height="104" rx="12" fill="#fff8e8" stroke="#c79a3c" stroke-width="2"/>
  <text x="82" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6b4a08">CSV files</text>
  <text x="82" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a18">Billing export + utilization export</text>
  <text x="82" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a18">UTF-8, fixed generic schema</text>
  <text x="82" y="444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a6a28">Sample files are synthetic and labelled</text>

  <!-- API container -->
  <rect x="330" y="146" width="320" height="470" rx="14" fill="#f3fbf9" stroke="#0f766e" stroke-width="2"/>
  <text x="352" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b4f4a">FastAPI application</text>
  <text x="352" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d6b67">Python 3.12 · Pydantic v2 · SQLAlchemy 2.0</text>

  <rect x="352" y="214" width="276" height="62" rx="9" fill="#ffffff" stroke="#8fc7c1"/>
  <text x="368" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#143f3b">API routes</text>
  <text x="368" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">/api imports, costs, findings, decisions, exports</text>

  <rect x="352" y="290" width="276" height="150" rx="9" fill="#ffffff" stroke="#8fc7c1"/>
  <text x="368" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#143f3b">Deterministic engine</text>
  <text x="368" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Validation and de-duplication</text>
  <text x="368" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Exact scaled-decimal cost totals</text>
  <text x="368" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Idle / rightsize rules with evidence</text>
  <text x="368" y="393" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Seasonal-naive forecast + holdout</text>
  <text x="368" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Immutable decisions and exports</text>

  <rect x="352" y="454" width="276" height="76" rx="9" fill="#ffffff" stroke="#8fc7c1"/>
  <text x="368" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#143f3b">Advisor guardrails</text>
  <text x="368" y="498" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Schema, evidence-ID and numeric-claim</text>
  <text x="368" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">validation; deterministic fallback</text>

  <rect x="352" y="544" width="276" height="52" rx="9" fill="#e9f2f0" stroke="#8fc7c1"/>
  <text x="368" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#143f3b">Alembic migrations · UTC storage</text>
  <text x="368" y="584" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d5b58">Money stored as scaled BIGINT, never float</text>

  <!-- Database -->
  <rect x="720" y="206" width="210" height="170" rx="12" fill="#eef4ff" stroke="#6f8fc4" stroke-width="2"/>
  <text x="742" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#17325c">Data store</text>
  <text x="742" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334a6b">SQLite (default, local file)</text>
  <text x="742" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334a6b">PostgreSQL 16 (Compose)</text>
  <text x="742" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b83">Imports, normalized rows, price</text>
  <text x="742" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b83">catalogue, findings, decisions,</text>
  <text x="742" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b83">forecast runs, advisor reports</text>

  <!-- Static serving note -->
  <rect x="720" y="404" width="210" height="84" rx="12" fill="#eef4ff" stroke="#6f8fc4" stroke-width="1.5"/>
  <text x="742" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#17325c">Static SPA</text>
  <text x="742" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334a6b">Built frontend served by FastAPI</text>
  <text x="742" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334a6b">from the same origin at /</text>

  <!-- Optional LLM -->
  <rect x="330" y="622" width="320" height="92" rx="12" fill="#fbf4ff" stroke="#8b5fbf" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="352" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4b2378">Optional LLM provider · opt-in</text>
  <text x="352" y="671" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f3d86">Groq (free tier default) · Gemini · OpenRouter · Ollama</text>
  <text x="352" y="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f3d86">Receives a bounded, redacted evidence package over HTTPS.</text>
  <text x="352" y="706" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4b2378">Explains only. Cannot create prices, savings or actions.</text>

  <!-- No cloud band -->
  <rect x="690" y="640" width="256" height="62" rx="10" fill="#fdecec" stroke="#b23b3b" stroke-width="2"/>
  <text x="712" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7d1d1d">No cloud write path</text>
  <text x="712" y="687" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8c3030">No provider credentials. No stops or resizes.</text>

  <!-- Arrows -->
  <line x1="270" y1="243" x2="330" y2="243" stroke="#3b4a63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="277" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b4a63">HTTP /api</text>

  <line x1="330" y1="262" x2="270" y2="262" stroke="#3b4a63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="276" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b4a63">JSON</text>

  <line x1="270" y1="402" x2="330" y2="402" stroke="#c79a3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="271" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7a5a18">upload</text>

  <line x1="650" y1="290" x2="720" y2="290" stroke="#3b4a63" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="310" x2="650" y2="310" stroke="#3b4a63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b4a63">SQLAlchemy</text>

  <line x1="490" y1="616" x2="490" y2="596" stroke="#8b5fbf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="612" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b2378">only if enabled</text>

  <text x="40" y="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b83">All money is exact Decimal in storage and BigInt formatting in the UI. Currencies are reported separately and never silently combined.</text>
  <text x="40" y="740" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b83">Findings, forecasts and advisor output always require human review before any real-world change.</text>
</svg>
