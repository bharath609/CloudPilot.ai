name: cloudpilot-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudpilot
      POSTGRES_PASSWORD: cloudpilot_dev
      POSTGRES_DB: cloudpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpilot -d cloudpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CLOUDPILOT_ENVIRONMENT: development
      CLOUDPILOT_DATABASE_URL: postgresql+psycopg://cloudpilot:cloudpilot_dev@db:5432/cloudpilot
      CLOUDPILOT_AUTO_CREATE_TABLES: "false"
      CLOUDPILOT_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
